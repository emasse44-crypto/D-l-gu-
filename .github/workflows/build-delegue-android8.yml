name: Build Délégué Football Android 8 - V58

on:
  push:
    paths:
      - "delegue-android8-apk/**"
      - ".github/workflows/build-delegue-android8.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer les composants Android
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Construire l'APK
        run: gradle --no-daemon :app:assembleDebug
        working-directory: delegue-android8-apk

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: delegue-football-android8
          path: delegue-android8-apk/app/build/outputs/apk/debug/app-debug.apk
