name: Build Délégué Football Android 8 - V58

on:
  push:
    paths:
      - "delegue-android8-apk/**"
      - ".github/workflows/build-delegue-android8.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Accepter les licences Android
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Installer les composants Android
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Vérifier Java et Gradle
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed

      - name: Construire l'APK Android 8
        working-directory: delegue-android8-apk
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: delegue-football-android8-V58
          path: delegue-android8-apk/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
