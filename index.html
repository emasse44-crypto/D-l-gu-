<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="description" content="Tableau de scores football pour téléphone et tablette">
<link rel="manifest" href="./manifest.webmanifest">
<title>Tableau des scores Football</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#111827;color:#fff}
body{display:flex;justify-content:center;padding:16px}.app{width:min(100%,900px)}
header{padding:18px 0 12px;text-align:center}h1{margin:0;font-size:clamp(24px,6vw,42px)}.sub{opacity:.7;margin-top:6px}
.card{background:#1f2937;border:1px solid #374151;border-radius:18px;padding:20px;margin-top:16px}
.teams{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;text-align:center}.team{font-size:clamp(20px,5vw,32px);font-weight:700}.score{font-size:clamp(48px,13vw,88px);font-weight:800}
button{border:0;border-radius:12px;padding:14px 18px;font-size:18px;font-weight:700;cursor:pointer}.primary{background:#fff;color:#111827;width:100%;margin-top:18px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row button{flex:1;min-width:120px}
.note{margin:16px 0 0;text-align:center;opacity:.65;font-size:14px}
</style>
</head>
<body>
<main class="app">
<header><h1>Tableau des scores Football</h1><div class="sub">Nouvelle base propre</div></header>
<section class="card">
<div class="teams"><div class="team">Équipe A</div><div class="score" id="score">0 - 0</div><div class="team">Équipe B</div></div>
<button class="primary" id="newMatch">Nouveau match</button>
<div class="row"><button id="minusA">− Équipe A</button><button id="plusA">+ Équipe A</button><button id="minusB">− Équipe B</button><button id="plusB">+ Équipe B</button></div>
<p class="note">Base technique stable. Les fonctions du match seront ajoutées une par une.</p>
</section>
</main>
<script>
let a=0,b=0;
function render(){document.getElementById("score").textContent=a+" - "+b}
document.getElementById("plusA").onclick=()=>{a++;render()};
document.getElementById("minusA").onclick=()=>{a=Math.max(0,a-1);render()};
document.getElementById("plusB").onclick=()=>{b++;render()};
document.getElementById("minusB").onclick=()=>{b=Math.max(0,b-1);render()};
document.getElementById("newMatch").onclick=()=>{a=0;b=0;render()};
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}
</script>
</body>
</html>
