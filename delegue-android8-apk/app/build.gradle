plugins {
    id 'com.android.application'
}

android {
    namespace 'fr.deleguefootball.android8'
    compileSdk 35

    defaultConfig {
        applicationId 'fr.deleguefootball.android8.v1'
        minSdk 26
        targetSdk 28
        versionCode 2
        versionName '2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.12.0'
}
