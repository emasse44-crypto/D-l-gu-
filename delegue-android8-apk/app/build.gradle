plugins {
    id 'com.android.application'
}

android {
    namespace 'fr.deleguefootball.android8'
    compileSdk 35

    defaultConfig {
        applicationId 'fr.deleguefootball.android8.test'
        minSdk 26
        targetSdk 28
        versionCode 3
        versionName '3.0-test'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.12.0'
}
