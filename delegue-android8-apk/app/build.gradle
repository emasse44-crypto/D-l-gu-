plugins {
    id 'com.android.application'
}

android {
    namespace 'fr.deleguefootball.android8'
    compileSdk 35

    defaultConfig {
        applicationId 'fr.deleguefootball.android8.official'
        minSdk 26
        targetSdk 28
        versionCode 4
        versionName '2.0-official'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.12.0'
}
